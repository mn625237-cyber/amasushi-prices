<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1117">
<title>داشبورد الويتر — اما سوشي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Cairo', sans-serif;
  background: #0f1117;
  color: #e2e8f0;
  min-height: 100vh;
}

/* ── Header ── */
.hdr {
  background: #1a1d27;
  border-bottom: 1px solid #2d3148;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}

.hdr-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.hdr-title {
  font-size: 15px;
  font-weight: 700;
  color: #e67e22;
}

.pending-badge {
  background: #e67e22;
  color: white;
  font-size: 11px;
  font-weight: 900;
  padding: 2px 9px;
  border-radius: 999px;
  min-width: 24px;
  text-align: center;
  display: none;
  animation: badge-pop 0.3s ease;
}
.pending-badge.show { display: inline-block; }

@keyframes badge-pop {
  0%   { transform: scale(0.5); }
  70%  { transform: scale(1.2); }
  100% { transform: scale(1); }
}

/* ── Audio unlock button ── */
.audio-btn {
  background: #0f1117;
  border: 1px solid #2d3148;
  border-radius: 10px;
  color: #64748b;
  padding: 8px 13px;
  font-family: 'Cairo', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.audio-btn.on {
  background: #052e16;
  border-color: #16a34a;
  color: #22c55e;
}

/* ── Main body ── */
.body {
  padding: 14px 14px 40px;
  max-width: 480px;
  margin: 0 auto;
}

/* ── Empty state ── */
.empty {
  text-align: center;
  padding: 70px 20px;
  color: #475569;
}
.empty-icon { font-size: 52px; margin-bottom: 14px; }
.empty-txt  { font-size: 14px; }

/* ── Call card ── */
.call-card {
  background: #1a1d27;
  border: 1px solid #2d3148;
  border-radius: 16px;
  padding: 14px 14px 14px 16px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: opacity 0.4s, border-color 0.3s, box-shadow 0.3s;
}

/* New / pending */
.call-card.pending {
  border-color: #e67e22;
  box-shadow: 0 0 0 2px rgba(230,126,34,0.18);
  animation: ring 0.8s ease 2;
}
@keyframes ring {
  0%,100% { box-shadow: 0 0 0 2px rgba(230,126,34,0.18); }
  50%      { box-shadow: 0 0 0 7px rgba(230,126,34,0.08); }
}

/* Done */
.call-card.done {
  opacity: 0.38;
  border-color: #1e293b;
  box-shadow: none;
}

/* Table number block */
.tbl-block {
  width: 56px;
  height: 56px;
  border-radius: 13px;
  background: #e67e22;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.3s;
}
.call-card.done .tbl-block { background: #2d3148; }

.tbl-lbl { font-size: 8px; color: rgba(255,255,255,0.75); font-weight: 400; }
.tbl-num { font-size: 26px; font-weight: 900; color: white; line-height: 1; }

/* Info */
.call-info { flex: 1; min-width: 0; }
.call-status {
  font-size: 13px;
  font-weight: 700;
  color: #e67e22;
  margin-bottom: 3px;
}
.call-card.done .call-status { color: #475569; }
.call-time { font-size: 11px; color: #475569; }

/* Done button */
.done-btn {
  padding: 8px 13px;
  background: #052e16;
  border: 1px solid #16a34a;
  border-radius: 10px;
  color: #22c55e;
  font-family: 'Cairo', sans-serif;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
  transition: opacity 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.done-btn:active { opacity: 0.7; }

.done-label {
  font-size: 12px;
  color: #334155;
  flex-shrink: 0;
  padding: 0 4px;
}
</style>
</head>
<body>

<!-- Header -->
<div class="hdr">
  <div class="hdr-left">
    <div class="hdr-title">🔔 داشبورد الويتر</div>
    <span class="pending-badge" id="badge"></span>
  </div>
  <button class="audio-btn" id="audioBtn" onclick="unlockAudio()">
    🔇 تفعيل الصوت
  </button>
</div>

<!-- Cards list -->
<div class="body">
  <div id="list">
    <div class="empty">
      <div class="empty-icon">🍽️</div>
      <div class="empty-txt">لا توجد طلبات حالياً</div>
    </div>
  </div>
</div>


<script>
// ── Firebase ──
const firebaseConfig = {
  apiKey:            "AIzaSyBRSTsBy_2rgfqWASSFAF3jNXe2fgvnWw8",
  authDomain:        "amasushi-prices.firebaseapp.com",
  projectId:         "amasushi-prices",
  storageBucket:     "amasushi-prices.firebasestorage.app",
  messagingSenderId: "972743740267",
  appId:             "1:972743740267:web:24eb04cf828b545a41da2e"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();


// ── Audio / TTS ──
let audioOn  = false;
let arVoice  = null;

// Pre-load Arabic voice list (async on some browsers)
function loadVoices() {
  const all = speechSynthesis.getVoices();
  arVoice = all.find(v => v.lang.startsWith('ar')) || null;
}
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = loadVoices;
}

function unlockAudio() {
  audioOn = true;
  const btn = document.getElementById('audioBtn');
  btn.textContent = '🔊 الصوت فعّال';
  btn.classList.add('on');
  btn.onclick = null; // single-use

  // Silent utterance — unlocks audio context on iOS/Android
  const warm = new SpeechSynthesisUtterance('.');
  warm.volume = 0.01;
  warm.lang   = 'ar-SA';
  speechSynthesis.speak(warm);
}

function speak(tableNum) {
  if (!audioOn || !window.speechSynthesis) return;
  speechSynthesis.cancel();

  const msg   = new SpeechSynthesisUtterance(
    `الترابيزة رقم ${tableNum} تطلب الويتر`
  );
  msg.lang   = 'ar-SA';
  msg.rate   = 0.78;
  msg.pitch  = 1;
  msg.volume = 1;
  if (arVoice) msg.voice = arVoice;

  speechSynthesis.speak(msg);
}


// ── Helpers ──
function fmt(ts) {
  if (!ts) return '—';
  return ts.toDate().toLocaleTimeString('ar-EG', {
    hour: '2-digit', minute: '2-digit'
  });
}

function renderCard(c) {
  const isPending = c.status === 'pending';
  return `
    <div class="call-card ${isPending ? 'pending' : 'done'}" id="c-${c.id}">
      <div class="tbl-block">
        <div class="tbl-lbl">ترابيزة</div>
        <div class="tbl-num">${c.table}</div>
      </div>
      <div class="call-info">
        <div class="call-status">
          ${isPending ? '🔔 تطلب الويتر' : '✅ تمت الخدمة'}
        </div>
        <div class="call-time">${fmt(c.timestamp)}</div>
      </div>
      ${isPending
        ? `<button class="done-btn" onclick="markDone('${c.id}')">تم ✓</button>`
        : `<span class="done-label">تم</span>`
      }
    </div>`;
}

function updateBadge(count) {
  const el = document.getElementById('badge');
  if (count > 0) {
    el.textContent = count;
    el.classList.add('show');
  } else {
    el.classList.remove('show');
  }
}


// ── Mark done ──
async function markDone(id) {
  try {
    await db.collection('amasushi_waiter_calls')
      .doc(id)
      .update({ status: 'done' });
  } catch(e) {
    alert('خطأ في التحديث');
  }
}


// ── Realtime listener ──
const announced  = new Set(); // IDs already spoken
let   firstSnap  = true;      // skip TTS on initial page load

db.collection('amasushi_waiter_calls')
  .orderBy('timestamp', 'desc')
  .limit(30)
  .onSnapshot(snap => {

    // On first load: mark all existing as known (don't announce old calls)
    if (firstSnap) {
      snap.docs.forEach(d => announced.add(d.id));
      firstSnap = false;
    }

    // Detect new pending calls added after page opened
    snap.docChanges().forEach(change => {
      if (change.type === 'added') {
        const id   = change.doc.id;
        const data = change.doc.data();
        if (!announced.has(id) && data.status === 'pending') {
          announced.add(id);
          speak(data.table);
        }
      }
    });

    // Render pending cards only — done cards are removed immediately
    const calls   = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const pending = calls.filter(c => c.status === 'pending');

    updateBadge(pending.length);

    const list = document.getElementById('list');
    if (pending.length === 0) {
      list.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🍽️</div>
          <div class="empty-txt">لا توجد طلبات حالياً</div>
        </div>`;
    } else {
      list.innerHTML = pending.map(renderCard).join('');
    }
  });
</script>
</body>
</html>

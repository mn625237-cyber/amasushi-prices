<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - اما سوشي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Cairo', sans-serif;
  background: #0f1117;
  color: #e2e8f0;
  min-height: 100vh;
}

/* ─── LOGIN ─── */
#loginScreen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  background: #0f1117;
}
.login-card {
  background: #1a1d27;
  border: 1px solid #2d3148;
  border-radius: 20px;
  padding: 40px 35px;
  width: 100%;
  max-width: 380px;
  text-align: center;
}
.login-logo {
  font-size: 40px;
  margin-bottom: 10px;
}
.login-title {
  font-size: 20px;
  font-weight: 700;
  color: #e67e22;
  margin-bottom: 6px;
}
.login-sub {
  font-size: 13px;
  color: #64748b;
  margin-bottom: 30px;
}
.login-input {
  width: 100%;
  padding: 14px 18px;
  background: #0f1117;
  border: 1px solid #2d3148;
  border-radius: 12px;
  color: #e2e8f0;
  font-family: inherit;
  font-size: 14px;
  margin-bottom: 12px;
  outline: none;
  transition: border-color 0.2s;
}
.login-input:focus { border-color: #e67e22; }
.login-btn {
  width: 100%;
  padding: 14px;
  background: #e67e22;
  border: none;
  border-radius: 12px;
  color: white;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s;
  margin-top: 4px;
}
.login-btn:hover { background: #d35400; }
.login-error {
  color: #ef4444;
  font-size: 13px;
  margin-top: 12px;
  display: none;
}

/* ─── DASHBOARD ─── */
#dashboard { display: none; }

.topbar {
  background: #1a1d27;
  border-bottom: 1px solid #2d3148;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.topbar-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 17px;
  color: #e67e22;
}
.logout-btn {
  background: #2d3148;
  border: none;
  border-radius: 8px;
  color: #94a3b8;
  padding: 8px 16px;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.logout-btn:hover { background: #ef4444; color: white; }

.main {
  padding: 24px;
  max-width: 900px;
  margin: 0 auto;
}

/* ─── STAT CARDS ─── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: #1a1d27;
  border: 1px solid #2d3148;
  border-radius: 16px;
  padding: 20px;
  text-align: center;
}
.stat-icon { font-size: 28px; margin-bottom: 8px; }
.stat-num {
  font-size: 32px;
  font-weight: 700;
  color: #e67e22;
  line-height: 1;
}
.stat-label {
  font-size: 12px;
  color: #64748b;
  margin-top: 4px;
}

/* ─── SECTIONS ─── */
.section {
  background: #1a1d27;
  border: 1px solid #2d3148;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 20px;
}
.section-title {
  font-size: 15px;
  font-weight: 700;
  color: #94a3b8;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ─── DEVICE BARS ─── */
.device-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}
.device-label {
  font-size: 13px;
  min-width: 80px;
  color: #e2e8f0;
}
.bar-wrap {
  flex: 1;
  background: #0f1117;
  border-radius: 999px;
  height: 10px;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: 999px;
  background: #e67e22;
  transition: width 0.8s ease;
}
.bar-fill.blue  { background: #3b82f6; }
.bar-fill.green { background: #22c55e; }
.device-count {
  font-size: 13px;
  font-weight: 700;
  color: #e67e22;
  min-width: 30px;
  text-align: left;
}

/* ─── SEARCH LIST ─── */
.search-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 14px;
  background: #0f1117;
  border-radius: 10px;
  margin-bottom: 8px;
}
.search-text { font-size: 14px; }
.search-count {
  background: #e67e22;
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 999px;
}

/* ─── RECENT LOG ─── */
.log-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #2d3148;
  font-size: 13px;
}
.log-item:last-child { border-bottom: none; }
.log-device { color: #94a3b8; }
.log-time   { color: #64748b; font-size: 11px; }

/* ─── LOADING ─── */
.loading {
  text-align: center;
  color: #64748b;
  padding: 40px;
  font-size: 14px;
}
</style>
</head>
<body>

<!-- ─── LOGIN SCREEN ─── -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">🍣</div>
    <div class="login-title">لوحة تحكم اما سوشي</div>
    <div class="login-sub">للمدير فقط</div>
    <input type="email" id="emailInput" class="login-input" placeholder="البريد الإلكتروني">
    <input type="password" id="passInput" class="login-input" placeholder="كلمة المرور">
    <button class="login-btn" onclick="doLogin()">دخول</button>
    <div class="login-error" id="loginError">بيانات غير صحيحة، حاول مجدداً</div>
  </div>
</div>

<!-- ─── DASHBOARD ─── -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-title">🍣 لوحة التحكم — اما سوشي</div>
    <button class="logout-btn" onclick="doLogout()">تسجيل خروج</button>
  </div>

  <div class="main">

    <!-- Stat Cards -->
    <div class="cards-grid">
      <div class="stat-card">
        <div class="stat-icon">👁️</div>
        <div class="stat-num" id="totalVisits">—</div>
        <div class="stat-label">إجمالي الزيارات</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📅</div>
        <div class="stat-num" id="todayVisits">—</div>
        <div class="stat-label">زيارات اليوم</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📱</div>
        <div class="stat-num" id="mobilePercent">—</div>
        <div class="stat-label">من موبايل</div>
      </div>
    </div>

    <!-- Devices -->
    <div class="section">
      <div class="section-title">📊 الأجهزة والأنظمة</div>
      <div id="deviceStats"><div class="loading">جاري التحميل...</div></div>
    </div>

    <!-- Recent Visits -->
    <div class="section">
      <div class="section-title">🕐 آخر الزيارات</div>
      <div id="recentVisits"><div class="loading">جاري التحميل...</div></div>
    </div>

  </div>
</div>

<script>
// ==========================================
// Firebase Init
// ==========================================
const firebaseConfig = {
  apiKey:            "AIzaSyBRSTsBy_2rgfqWASSFAF3jNXe2fgvnWw8",
  authDomain:        "amasushi-prices.firebaseapp.com",
  projectId:         "amasushi-prices",
  storageBucket:     "amasushi-prices.firebasestorage.app",
  messagingSenderId: "972743740267",
  appId:             "1:972743740267:web:24eb04cf828b545a41da2e"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

// ==========================================
// Auth
// ==========================================
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').style.display  = 'block';
    loadDashboard();
  } else {
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dashboard').style.display  = 'none';
  }
});

function doLogin() {
  const email = document.getElementById('emailInput').value.trim();
  const pass  = document.getElementById('passInput').value;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';

  auth.signInWithEmailAndPassword(email, pass).catch(() => {
    errEl.style.display = 'block';
  });
}

function doLogout() {
  auth.signOut();
}

// ==========================================
// Dashboard Data
// ==========================================
async function loadDashboard() {
  const now       = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  // ── Visits ──
  const visitsSnap = await db.collection('amasushi_visits').orderBy('timestamp', 'desc').get();
  const visits = visitsSnap.docs.map(d => d.data());

  const totalVisits  = visits.length;
  const todayVisits  = visits.filter(v => v.timestamp?.toDate() >= todayStart).length;
  const mobileCount  = visits.filter(v => v.device === 'mobile').length;
  const mobilePercent = totalVisits > 0 ? Math.round((mobileCount / totalVisits) * 100) : 0;

  document.getElementById('totalVisits').textContent   = totalVisits;
  document.getElementById('todayVisits').textContent   = todayVisits;
  document.getElementById('mobilePercent').textContent = mobilePercent + '%';
  const osCounts = {};
  const browserCounts = {};
  visits.forEach(v => {
    osCounts[v.os]         = (osCounts[v.os]         || 0) + 1;
    browserCounts[v.browser] = (browserCounts[v.browser] || 0) + 1;
  });

  const deviceHTML = `
    <div style="margin-bottom:18px">
      <div style="font-size:12px;color:#64748b;margin-bottom:10px">نظام التشغيل</div>
      ${renderBars(osCounts, totalVisits, ['#e67e22','#3b82f6','#22c55e','#a78bfa'])}
    </div>
    <div>
      <div style="font-size:12px;color:#64748b;margin-bottom:10px">المتصفح</div>
      ${renderBars(browserCounts, totalVisits, ['#3b82f6','#e67e22','#22c55e','#f59e0b'])}
    </div>
  `;
  document.getElementById('deviceStats').innerHTML = deviceHTML;

  // ── Device Stats ──
  const osCounts = {};
  const browserCounts = {};
  visits.forEach(v => {
    osCounts[v.os]           = (osCounts[v.os]           || 0) + 1;
    browserCounts[v.browser] = (browserCounts[v.browser] || 0) + 1;
  });

  document.getElementById('deviceStats').innerHTML = `
    <div style="margin-bottom:18px">
      <div style="font-size:12px;color:#64748b;margin-bottom:10px">نظام التشغيل / الجهاز</div>
      ${renderBars(osCounts, totalVisits, ['#e67e22','#3b82f6','#22c55e','#a78bfa','#f59e0b'])}
    </div>
    <div>
      <div style="font-size:12px;color:#64748b;margin-bottom:10px">المتصفح</div>
      ${renderBars(browserCounts, totalVisits, ['#3b82f6','#e67e22','#22c55e','#f59e0b'])}
    </div>
  `;

  // ── Recent Visits ──
  const recent = visits.slice(0, 20);
  document.getElementById('recentVisits').innerHTML = recent.length > 0
    ? recent.map(v => {
        const t = v.timestamp?.toDate();
        const timeStr = t ? `${t.toLocaleDateString('ar-EG')} - ${t.toLocaleTimeString('ar-EG', {hour:'2-digit',minute:'2-digit'})}` : '—';
        return `
          <div class="log-item">
            <span class="log-device">📱 ${v.os || '—'} · ${v.browser || '—'} · ${v.device || '—'}</span>
            <span class="log-time">${timeStr}</span>
          </div>`;
      }).join('')
    : '<div class="loading">لا توجد زيارات بعد</div>';
}

function renderBars(counts, total, colors) {
  return Object.entries(counts)
    .sort((a, b) => b[1] - a[1])
    .map(([label, count], i) => {
      const pct = total > 0 ? Math.round((count / total) * 100) : 0;
      const color = colors[i % colors.length];
      return `
        <div class="device-row">
          <div class="device-label">${label}</div>
          <div class="bar-wrap">
            <div class="bar-fill" style="width:${pct}%;background:${color}"></div>
          </div>
          <div class="device-count" style="color:${color}">${count}</div>
        </div>`;
    }).join('');
}
</script>

</body>
</html>
